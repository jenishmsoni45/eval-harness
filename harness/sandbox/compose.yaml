# The two services of one attempt (design.md 2, D10, D21, D27).
#
# Inspect fills ${SAMPLE_METADATA_IMAGE} from each sample's metadata and starts the services as
# compose project inspect-evalh-i<random> (D25). Its --project-name overrides `name` below, which
# applies only when this file is used directly. Every setting is written out for each service,
# because a custom compose file replaces Inspect's generated one (D27); tests/unit/test_compose.py
# checks them.
#
# Each service runs as root with every capability dropped but SETUID and SETGID, and only its init
# and keep-alive run that way: every tool call and every scorer command runs as `agent`. So an
# agent that kills all its own processes cannot stop its container, and Inspect's text_editor
# helper can still switch to `agent` (D60). no-new-privileges keeps any agent process from gaining
# a capability.
name: evalh

services:
  # The agent's container. Inspect's bash and text_editor tools act only on this service.
  default:
    image: ${SAMPLE_METADATA_IMAGE}
    x-local: true
    pull_policy: never
    init: true
    command: ["sleep", "infinity"]
    working_dir: /work/repo
    user: root
    network_mode: none
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: UTC
      LANG: C.UTF-8
      PYTHONHASHSEED: "0"

  # The scoring container (D10). It idles until scoring: no tool targets it, and with no network
  # and no shared volume the agent cannot reach it.
  scorer:
    image: ${SAMPLE_METADATA_IMAGE}
    x-local: true
    pull_policy: never
    init: true
    command: ["sleep", "infinity"]
    working_dir: /work/repo
    user: root
    network_mode: none
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: UTC
      LANG: C.UTF-8
      PYTHONHASHSEED: "0"
