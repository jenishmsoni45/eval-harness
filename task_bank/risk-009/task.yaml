    - tests/hidden/test_smallest_factor.py::test_the_count_for_the_factor_below_is_what_it_stops
    - tests/hidden/test_smallest_factor.py::test_one_amount_rule_by_hand
    - tests/hidden/test_smallest_factor.py::test_any_list_of_amounts_gets_the_smallest_factor
  regression:
