# Every pull request (D15): lint and type checks, the dependency audit, validation of the tasks
# the pull request adds or changes, and the test suite, which runs the Docker tests on amd64.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.13.6"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the validator diffs against the base branch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Lint and type checks
        run: make lint
      - name: Audit locked dependencies
        run: make audit
      - name: Validate changed tasks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make validate VALIDATE_ARGS="--changed-since origin/${BASE_REF}"
      - name: Tests
        run: make test
      - name: No containers left behind
        if: always()
        run: uv run --frozen python -m harness.containers
