# Run by hand (D15): validates every task in the bank. Run it before merging a pull request that
# changes many tasks or the shared base images.
name: validate-all

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.13.6"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Validate every task
        run: make validate
      - name: No containers left behind
        if: always()
        run: uv run --frozen python -m harness.containers
